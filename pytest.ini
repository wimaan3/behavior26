[pytest]
testpaths = tests
markers =
    openpi: needs the openpi fork checkout and a jax install

# There are two suites and they need two environments. Running `pytest tests/`
# in either one fails the other's tests on a missing import, so run them
# separately:
#
#   pytest tests/test_pipeline.py tests/test_progress_labels.py -q
#       Evaluation pipeline and the progress-label merge. Needs
#       requirements-tools.txt (websockets, msgpack, pandas, pyarrow). ~15s.
#
#   OPENPI_ROOT=../openpi pytest tests/test_progress_head.py \
#       tests/test_shipped_configs.py tests/test_progress_labels.py -q
#       Training / model. Needs the openpi checkout and requirements-training.txt
#       (jax, flax, torch). ~2min -- it builds and differentiates a real, tiny Pi0
#       on CPU. Skips cleanly if either is absent.
#
#   test_progress_labels.py runs in BOTH; some of its cases skip without
#   `datasets` or without openpi.
#
# Deselect the model tests with: pytest -m "not openpi"
