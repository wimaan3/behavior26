[pytest]
testpaths = tests
markers =
    openpi: needs the openpi fork checkout and a jax install

# There are two suites and they need two environments. Running `pytest tests/`
# in either one fails the other's tests on a missing import, so run them
# separately:
#
#   pytest tests/test_pipeline.py -q
#       Evaluation pipeline. Needs requirements-tools.txt (websockets, msgpack,
#       pandas). ~3s.
#
#   OPENPI_ROOT=../openpi pytest tests/test_progress_head.py -q
#       Training / model. Needs the openpi checkout and requirements-training.txt
#       (jax, flax, torch). ~90s -- it builds and differentiates a real, tiny Pi0
#       on CPU. Skips cleanly if either is absent.
#
# Deselect the model tests with: pytest -m "not openpi"
