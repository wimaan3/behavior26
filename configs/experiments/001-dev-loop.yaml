# The frozen dev subset. Runs every iteration.
# ~36 rollouts, roughly 13 GPU-hours, overnight on two cards.
#
# Three rules:
#   1. Keep this list FROZEN so numbers are comparable across iterations.
#   2. Run --mode train. CORRECTED 2026-09-04 against BEHAVIOR-1K v3.9.2: rule 2
#      used to say "instances 10-19 only", which does not do what it sounds like.
#      TEST_INSTANCE_IDS = range(301, 341) and public_test is the FIRST 20 of
#      those, so --instance-indices 10-19 selects instances 311-320 -- all of
#      which are scored, because compute_final_q_score averages over all 20
#      public instances per task. There is no free holdout inside public_test.
#      The train split is the only place to iterate without tuning on the
#      leaderboard.
#   3. INCLUDE 2-3 TYPE C TASKS even though they will score badly.
#
# On rule 3 -- Q5 established that the cheap 10-task slice is mostly Type A/B
# predicates: visually inferable from the current frame. A dev set made only of
# those is biased in favour of our own hypothesis. The predicate head will look
# great, we will conclude memory is unnecessary, and then we will hit the Type C
# tasks at 100-task scale and find out otherwise.
#
#   A. visible now        open(door), ontop(cup, table)     no memory needed
#   B. occluded           cereal in cabinet, door shut      memory or active looking
#   C. no visual signature cooked(steak), switch toggled    memory, unavoidably
#
# If the dev set cannot fail the way the real benchmark fails, it is not a
# measuring stick. Pick tasks spanning the failure modes, not the easy ones.

name: 001-dev-loop
description: Frozen 12-task dev subset for iteration.
hypothesis: n/a -- this is the measuring stick, not an experiment.

base_model: pi05
checkpoint: null

tasks: []                         # TODO: choose 12 after the Week 2 failure analysis
                                  # (blocked on the Jetson's full-scale phi_0 sweep)
                                  # Known bad, do not include: make_microwave_popcorn,
                                  # putting_dishes_away_after_cleaning,
                                  # rearranging_kitchen_furniture, storing_food.
mode: train                       # NOT public_test -- see rule 2 above
instances: [10, 11, 12]           # train instance ids (train mode: index == id)
num_rollouts: 1

host: 127.0.0.1
env_wrapper: omnigibson.eval.wrappers.RGBDFullResWrapper
robot_config: configs/robot/r1pro.yaml
max_steps: null
write_video: true
headless: true

heads: {predicate: false, progress: false, failure: false}
recovery_conditioning: false
heuristics: {gripper_auto_reopen: false, early_stop_on_goal: false}

wandb:
  project: behavior26
  tags: [dev-loop]
