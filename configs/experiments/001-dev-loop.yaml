# The frozen dev subset. Runs every iteration.
#
# CUT TO TWO TASKS on a $200 total budget (2026-09-05). We are not running the
# full 100-task submission: it is ~776 GPU-hr (~$233-388 on spot) and would
# score ~0.02 anyway, because Q averages over all 100 tasks and 98 of them
# would be zero. Partial submissions are allowed, so we submit only what we
# train: 2 tasks x 20 public instances = 40 rollouts, ~11 GPU-hr, ~$3-6 spot.
#
# The three D=1 control tasks are dropped. They were there to add Q, but the
# ceiling is ~0.02 with or without them, so they cost training money and add
# nothing to the contribution.
#
# Three rules:
#   1. Keep this list FROZEN so numbers are comparable across iterations.
#   2. TRAINING instances only (ids below 301). CORRECTED against BEHAVIOR-1K
#      v3.9.2: rule 2 used to say "instances 10-19 only", which does not mean
#      what it sounds like. TEST_INSTANCE_IDS = range(301, 341), public test is
#      the first 20 of those, and compute_final_q_score averages over ALL 20 per
#      task. So there is no self-test split inside the public set: iterating on
#      any of 301-320 is tuning on the leaderboard. 321-340 is hidden -- never
#      touch it. harness/launch.py refuses a train-mode config that names a test
#      instance. That guard is OURS, not the evaluator's -- upstream's
#      resolve_instance_ids returns train-mode ids unvalidated. Keep it; it
#      encodes how we have chosen to use the benchmark.
#   3. INCLUDE 2-3 TYPE C TASKS even though they will score badly.
#
# On rule 3 -- Q5 established that the cheap 10-task slice is mostly Type A/B
# predicates: visually inferable from the current frame. A dev set made only of
# those is biased in favour of our own hypothesis. The predicate head will look
# great, we will conclude memory is unnecessary, and then we will hit the Type C
# tasks at 100-task scale and find out otherwise.
#
#   A. visible now        open(door), ontop(cup, table)     no memory needed
#   B. occluded           cereal in cabinet, door shut      memory or active looking
#   C. no visual signature cooked(steak), switch toggled    memory, unavoidably
#
# If the dev set cannot fail the way the real benchmark fails, it is not a
# measuring stick. Pick tasks spanning the failure modes, not the easy ones.

name: 001-dev-loop
description: Frozen 12-task dev subset for iteration.
hypothesis: n/a -- this is the measuring stick, not an experiment.

base_model: pi05
checkpoint: null

# Both tasks are GRADED, not binary -- unlike the D=1 tasks on the shortlist's
# primary tier. That is a real advantage for the A/B: graded Q carries more
# information per rollout. Figures from analysis/reward/:
#
#   task                                    idx   D  rel_eval_cost  phi0_mean
#   set_up_a_coffee_station_in_your_kitchen  10   6      0.594        0.241
#   putting_shoes_on_rack                    22  10      0.733        0.111
#
# phi0_mean is what a do-nothing policy already banks, because Q is scored on
# the FINAL state and these tasks start partly satisfied. Any dQ we report is
# on top of that floor, not from zero.
tasks:
  - set_up_a_coffee_station_in_your_kitchen
  - putting_shoes_on_rack
mode: train                       # NOT public_test -- see rule 2 above
instances: [10, 11, 12]           # TRAINING instance ids (must be < 301)
num_rollouts: 1

host: 127.0.0.1
env_wrapper: omnigibson.eval.wrappers.RGBDFullResWrapper
robot_config: configs/robot/r1pro.yaml
max_steps: null
write_video: true
headless: true

heads: {predicate: false, progress: false, failure: false}
recovery_conditioning: false
heuristics: {gripper_auto_reopen: false, early_stop_on_goal: false}

wandb:
  project: behavior26
  tags: [dev-loop]
